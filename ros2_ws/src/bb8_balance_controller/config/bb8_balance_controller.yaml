bb8_balance_controller:
  ros__parameters:
    nav_cmd_topic: "cmd_vel"
    manual_cmd_topic: "cmd_vel_manual"
    output_twist_topic: "cmd_vel_balanced"
    jet_cmd_topic: "jet_cmd"
    status_topic: "balance/status"

    # Use either a real sensor_msgs/Imu topic or the legacy Sense HAT
    # Float32MultiArray topic. If both are enabled, the newest attitude wins.
    imu_topic: "imu/data"
    tilt_topic: "sense_hat/raw"
    tilt_topic_degrees: true
    odom_topic: ""

    # Prefer .npz exports on the Jetson. .onnx is also supported if ONNX Runtime
    # is installed.
    policy_path: ""
    allow_pd_fallback: false
    prefer_cuda: false

    control_rate_hz: 50.0
    status_rate_hz: 2.0
    require_attitude: true
    zero_on_stale_nav: true
    attitude_timeout_sec: 0.25
    nav_timeout_sec: 0.5
    manual_timeout_sec: 0.30
    odom_timeout_sec: 0.5

    # Robot physical center-of-gravity zero. Keep these at the measured
    # upright/resting attitude; launch_pi_balanced_drive.sh can override them
    # with ROLL_OFFSET_RAD and PITCH_OFFSET_RAD during drivetrain calibration.
    roll_offset_rad: 0.0
    pitch_offset_rad: 0.0
    roll_correction_sign: -1.0
    pitch_correction_sign: 1.0

    # Conservative authority limits for first learned-policy hardware bring-up.
    # PD fallback is intentionally disabled by default because it has not been
    # good enough on this robot.
    pd_kp: 3.0
    pd_kd: 0.45
    max_nav_speed_m_s: 1.0
    max_balance_accel_m_s2: 0.8
    max_correction_speed_m_s: 0.18
    max_output_accel_m_s2: 1.8
    balance_velocity_leak_per_s: 1.2
    action_filter_alpha: 0.65
    idle_action_nav_deadband_m_s: 0.03
    idle_action_tilt_deadband_rad: 0.035
    idle_action_rate_deadband_rad_s: 0.2
    tilt_cutoff_rad: 0.65

    servo_neutral: [0.0, 0.0, 0.0]
    active_state_value: 1.0
    stopped_state_value: 0.0
