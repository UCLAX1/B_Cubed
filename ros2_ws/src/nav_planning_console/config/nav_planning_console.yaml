nav_planning_console:
  ros__parameters:
    web_host: 127.0.0.1
    web_port: 8080
    map_topic: /map
    global_frame: map
    base_frame: base_link
    planner_action_name: compute_path_to_pose
    navigator_action_name: navigate_to_pose
    manual_cmd_topic: cmd_vel_manual
    manual_control_enabled: true
    manual_max_linear_velocity: 0.25
    manual_max_angular_velocity: 0.50
    planner_id: ""
    planner_server_timeout_sec: 2.0
    navigator_server_timeout_sec: 2.0
    planning_timeout_sec: 10.0
    navigation_plane_z: 0.0
    pose_update_period_sec: 0.2
    start_pose_rescue_enabled: true
    start_pose_rescue_radius: 0.50
    start_pose_rescue_clearance: 0.25
    start_pose_occupied_threshold: 65
    start_pose_unknown_is_occupied: false
