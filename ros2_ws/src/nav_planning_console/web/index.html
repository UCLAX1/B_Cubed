<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>B³ Console</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="/bb-8-svgrepo-com.svg" alt="BB-8">
        <span class="brand-name">B<sup>3</sup> Console</span>
      </div>
      <div class="status-strip">
        <span class="status-chip" id="mapStatus">map waiting</span>
        <span class="status-chip" id="poseStatus">pose waiting</span>
        <span class="status-chip" id="planStatus">planner idle</span>
        <span class="status-chip" id="navStatus">nav idle</span>
        <span class="status-chip" id="manualStatus">manual idle</span>
        <span class="status-chip" id="personStatus">person off</span>
      </div>
      <div class="toolbar">
        <button type="button" id="navigateButton" class="primary" title="Navigate to the planned goal" disabled>Navigate</button>
        <button type="button" id="stopButton" class="danger" title="Cancel navigation" disabled>Stop</button>
        <button type="button" id="fitButton" title="Fit map">Fit</button>
        <button type="button" id="clearButton" title="Clear path">Clear</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="control-panel" aria-label="Person tracking and manual navigation controls">
        <div class="panel-section">
          <h2>People</h2>
          <label class="toggle-row" for="personTrackingToggle">
            <span>Tracker</span>
            <input id="personTrackingToggle" type="checkbox">
            <span class="toggle-track" aria-hidden="true"></span>
          </label>
          <div class="person-view">
            <img id="personImage" alt="Person tracking view" hidden>
            <div id="personImagePlaceholder">No frame</div>
          </div>
          <dl class="metric-list">
            <div>
              <dt>Count</dt>
              <dd id="personCount">0</dd>
            </div>
            <div>
              <dt>Frame</dt>
              <dd id="personFrameAge">-</dd>
            </div>
          </dl>
        </div>

        <div class="panel-section">
          <h2>Manual</h2>
          <canvas id="manualCanvas" width="240" height="240"></canvas>
          <div class="manual-controls">
            <button type="button" id="manualCcwButton" title="Rotate counterclockwise">CCW</button>
            <button type="button" id="manualStopButton" class="danger" title="Stop manual command">Stop</button>
            <button type="button" id="manualCwButton" title="Rotate clockwise">CW</button>
          </div>
          <dl class="metric-list">
            <div>
              <dt>Cmd</dt>
              <dd id="manualCommand">0.00, 0.00, 0.00</dd>
            </div>
            <div>
              <dt>Wheels</dt>
              <dd id="manualWheels">0.00, 0.00, 0.00</dd>
            </div>
          </dl>
        </div>

      </aside>

      <section class="map-surface">
        <canvas id="mapCanvas"></canvas>
        <div class="floating-readout" id="readout">x 0.00, y 0.00</div>
      </section>

      <aside class="side-panel">
        <div class="panel-section">
          <h2>Goal</h2>
          <div class="field-row">
            <label for="headingMode">Heading</label>
            <select id="headingMode">
              <option value="current">Current</option>
              <option value="zero">Zero</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <div class="field-row">
            <label for="headingInput">Degrees</label>
            <input id="headingInput" type="number" value="0" step="5">
          </div>
          <dl class="metric-list">
            <div>
              <dt>X</dt>
              <dd id="goalX">-</dd>
            </div>
            <div>
              <dt>Y</dt>
              <dd id="goalY">-</dd>
            </div>
            <div>
              <dt>Path</dt>
              <dd id="pathCount">0 poses</dd>
            </div>
            <div>
              <dt>Z</dt>
              <dd id="goalZ">-</dd>
            </div>
          </dl>
        </div>

        <div class="panel-section">
          <h2>Robot</h2>
          <dl class="metric-list">
            <div>
              <dt>X</dt>
              <dd id="robotX">-</dd>
            </div>
            <div>
              <dt>Y</dt>
              <dd id="robotY">-</dd>
            </div>
            <div>
              <dt>Yaw</dt>
              <dd id="robotYaw">-</dd>
            </div>
            <div>
              <dt>Z</dt>
              <dd id="robotZ">-</dd>
            </div>
          </dl>
        </div>

        <div class="panel-section">
          <h2>Navigation</h2>
          <dl class="metric-list">
            <div>
              <dt>Dist</dt>
              <dd id="navDistance">-</dd>
            </div>
            <div>
              <dt>Time</dt>
              <dd id="navTime">-</dd>
            </div>
            <div>
              <dt>Recover</dt>
              <dd id="navRecoveries">-</dd>
            </div>
          </dl>
        </div>
      </aside>
    </main>

    <img class="x1-wordmark" src="/x1-wordmark-orange.png" alt="X1">

    <script src="/app.js"></script>
  </body>
</html>
